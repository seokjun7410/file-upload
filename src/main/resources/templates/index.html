<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>파일 업로드 확장자 정책</title>
</head>
<body>
<main>
    <h1>파일 업로드 확장자 정책</h1>
    <p id="policy-load-status" role="status">확장자 정책을 불러오는 중입니다.</p>

    <section aria-labelledby="fixed-policy-heading">
        <h2 id="fixed-policy-heading">고정 확장자</h2>
        <ul id="fixed-policy-list"></ul>
    </section>

    <section aria-labelledby="custom-policy-heading">
        <h2 id="custom-policy-heading">커스텀 확장자</h2>
        <form id="custom-policy-form">
            <label for="custom-extension-input">확장자</label>
            <input id="custom-extension-input" name="extension" type="text">
            <button id="custom-extension-add-button" type="submit">추가</button>
        </form>
        <ul id="custom-policy-list"></ul>
    </section>

    <section aria-labelledby="file-upload-heading">
        <h2 id="file-upload-heading">파일 업로드</h2>
        <form id="file-upload-form" enctype="multipart/form-data">
            <label for="file-input">파일</label>
            <input id="file-input" name="file" type="file">
            <button id="file-upload-button" type="submit">업로드</button>
        </form>
        <p id="file-upload-status" role="status">업로드할 파일을 선택해 주세요.</p>
    </section>
</main>
<script defer src="/webjars/axios/1.8.4/dist/axios.min.js"></script>
<script defer src="/js/extension-policy.js"></script>
</body>
</html>
