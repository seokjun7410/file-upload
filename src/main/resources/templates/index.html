<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ExampleEntity 테스트</title>
    <style>
        body { max-width: 720px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
        form { display: flex; gap: 8px; margin: 20px 0; }
        input { flex: 1; padding: 8px; }
        button { padding: 8px 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .error { color: #c00; }
    </style>
</head>
<body>
<h1>ExampleEntity 테스트</h1>
<p>H2 파일 DB에 저장된 데이터를 조회합니다.</p>

<form th:action="@{/examples}" method="post">
    <input type="text" name="name" placeholder="이름 입력" required>
    <button type="submit">저장</button>
</form>
<p class="error" th:if="${error}" th:text="${error}"></p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>이름</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="example : ${examples}">
        <td th:text="${example.id}"></td>
        <td th:text="${example.name}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(examples)}">
        <td colspan="2">저장된 데이터가 없습니다.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
